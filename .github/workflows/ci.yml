name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: windows-2025
            node: 24
    env:
      ADAPTER_MODE: mock
      DATA_MODE: synthetic
      DATA_DIR: .data/ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply fresh migrations
        run: npm run db:migrate
      - name: Test policy, integrations and dashboard
        run: npm test
      - name: Check syntax and publishable files
        run: npm run check
      - name: Evaluate synthetic fixtures
        run: npm run eval
      - name: Replay recorded model responses without external calls
        run: npm run eval:replay
      - name: Run the mock lead-to-meeting walkthrough
        run: npm run demo

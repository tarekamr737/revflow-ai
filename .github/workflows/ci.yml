name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    env:
      ADAPTER_MODE: mock
      DATA_MODE: synthetic
      DATA_DIR: .data/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply fresh migrations
        run: npm run db:migrate
      - name: Test policy, integrations and dashboard
        run: npm test
      - name: Check syntax and publishable files
        run: npm run check
      - name: Evaluate synthetic fixtures
        run: npm run eval
      - name: Replay recorded model responses without external calls
        run: npm run eval:replay
      - name: Run the mock lead-to-meeting walkthrough
        run: npm run demo
